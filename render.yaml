services:
  # Backend API
  - type: web
    name: tuc-bares-api
    env: python
    plan: free
    buildCommand: cd backend && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: cd backend && uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY_ANON
        sync: false
      - key: SUPABASE_KEY_ROLE
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_HOST
        value: 0.0.0.0
      - key: APP_PORT
        value: 8000

  # Frontend - CORREGIDO
  - type: web
    name: tuc-bares-frontend
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm install -g serve && serve -s dist -l 3000
    envVars:
      - key: VITE_API_URL
        value: https://tuc-bares-api.onrender.com  # ⚠️ REEMPLAZA CON TU BACKEND URL
