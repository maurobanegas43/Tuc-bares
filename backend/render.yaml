services:
  - type: web
    name: tuc-bares-api
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY_ANON
        sync: false
      - key: SUPABASE_KEY_ROLE
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_HOST
        value: 0.0.0.0
      - key: APP_PORT
        value: 8000
